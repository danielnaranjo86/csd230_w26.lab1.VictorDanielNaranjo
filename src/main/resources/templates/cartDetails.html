<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Shopping Cart</title>
</head>
<body>

<h1>Your Shopping Cart</h1>

<div th:if="${cart.products.empty}">
    <p>Your cart is empty.</p>
</div>

<table border="1" th:unless="${cart.products.empty}">
    <thead>
    <tr>
        <th>Item</th>
        <th>Details</th>
        <th>Price</th>
        <th>Action</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="product : ${cart.products}"
        th:with="
        itemLabel=
            ${product instanceof T(csd230.lab1.entities.PublicationEntity)} ? 'Publication' :
            (${product instanceof T(csd230.lab1.entities.InstrumentEntity)} ? 'Musical Instrument' :
            (${product instanceof T(csd230.lab1.entities.TicketEntity)} ? 'Ticket' : 'Item')),

        detailsText=
            ${product instanceof T(csd230.lab1.entities.PublicationEntity)} ?
                ('Title: ' + ${product.title} + ', Copies: ' + ${product.copies}) :
            (${product instanceof T(csd230.lab1.entities.InstrumentEntity)} ?
                ('Brand: ' + ${product.brand}) :
            (${product instanceof T(csd230.lab1.entities.TicketEntity)} ?
                ${product.description} :
                ''))
    ">

        <td th:text="${itemLabel}"></td>
        <td th:text="${detailsText}"></td>
        <td th:text="${product.price}"></td>

        <td>
            <a th:href="@{/cart/remove/{id}(id=${product.id})}">Remove</a>
        </td>
    </tr>

    </tbody>
</table>

<!-- PART 3 usually expects a checkout button -->
<div th:unless="${cart.products.empty}">
    <form th:action="@{/cart/checkout}" method="post">
        <button type="submit">Checkout</button>
    </form>


</div>

<p>
    <!-- Change this if your shopping page is /products instead of /books -->
    <a th:href="@{/books}">Continue Shopping</a>
</p>

</body>
</html>
